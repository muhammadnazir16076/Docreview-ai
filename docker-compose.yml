version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docreview-backend
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-this-super-secret-key-in-prod}
      - DB_PATH=/data/docreview.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
    volumes:
      - docreview_data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./docreview
      dockerfile: Dockerfile
    container_name: docreview-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  docreview_data:
